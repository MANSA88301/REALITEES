# Leak Blocker — fails the check when a push or pull request adds a real
# secret (API key, token, private key, password). Only the new commits are
# scanned, so old history never blocks today's work.
name: Leak Blocker

on:
  push:
  pull_request:

permissions:
  contents: read

# Only pull request runs cancel each other: each one rescans the whole PR.
# Push runs each scan their own range, so every push run must finish.
concurrency:
  group: leak-blocker-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Work out which commits are new
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null \
               && [ -n "$(git rev-list "origin/$DEFAULT_BRANCH..$AFTER")" ]; then
            # New branch: everything it adds on top of the default branch.
            range="origin/$DEFAULT_BRANCH..$AFTER"
          else
            # Force-push or first push: scan the full history. Audited
            # findings are listed in .gitleaksignore.
            range="$AFTER"
          fi
          echo "Scanning: $range"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          ./gitleaks git --redact --no-banner --verbose \
            --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent $RANGE" .
